name: Build Windows Standalone EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE (PyInstaller)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop-app/requirements.txt

      - name: Build Single-File Windows Executable
        run: |
          cd desktop-app
          pyinstaller --name "ltspice-component-adder-by-Basi" --windowed --onefile --noconfirm --clean --icon=icon.ico --add-data "icon.ico;." --add-data "Lt-Spice-models-main;Lt-Spice-models-main" --collect-all customtkinter --hidden-import PIL --hidden-import PIL._imagingtk --hidden-import tkinter --hidden-import tkinter.ttk app.py
        shell: cmd

      - name: Create Portable ZIP Archive
        run: |
          powershell Compress-Archive -Path "desktop-app/dist/ltspice-component-adder-by-Basi.exe" -DestinationPath "desktop-app/dist/ltspice-component-adder-v2.3.0.zip" -Force
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ltspice-component-adder-windows-exe
          path: |
            desktop-app/dist/ltspice-component-adder-by-Basi.exe
            desktop-app/dist/ltspice-component-adder-v2.3.0.zip
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.0
          name: "LTspice Component Adder Pro v2.3.0 (GitHub In-App Auto-Updater & 59 Verified Models)"
          body: |
            # ⚡ LTspice Component Adder Pro — Windows Standalone Release (v2.3.0)

            Built automatically via GitHub Actions for Windows 10 & Windows 11.

            ### 🚀 What's New in v2.3.0:
            - **🔄 GitHub In-App Auto-Updater**: The Windows app automatically checks GitHub Releases for new updates on launch in the background, or on demand via the **"Check for Updates"** button. If an update is detected, an interactive dialog allows 1-click download, verified streaming progress, and seamless self-replacement restart on Windows!
            - **📦 Portable ZIP Package**: Available as a `.zip` archive to run cleanly without Windows Defender SmartScreen MOTW browser flags.
            - **⚡ 1-Click Instant Install**: Open the app and click **⚡ Add All (59)** to install and verify all 59 components into LTspice in seconds.
            - **59 Genuine SPICE Semiconductor Models** covering standard EDC, LIC, and Analog/Digital laboratory syllabus (Boylestad, Malvino, Floyd, Millman-Halkias, Neamen).
            - **Germanium Diodes**: 1N34A, OA79, OA91, 1N270, 1N60 with authentic knee ($V_f \approx 0.25\text{V}$, $E_g = 0.67\text{eV}$).
            - **Laboratory BJTs**: SL100, SK100, BC547/548, BC557/558, BD139/140 Push-Pull pairs, TIP31C/32C, and 2N3055/MJ2955.
            - **JFETs & MOSFETs**: BFW10 ($V_p \approx -2.3\text{V}$), BFW11, 2N3819, 2N5460 (P-channel), 2N7000, BS170, IRF540N/9540N, 3N163 (Depletion mode).
            - **UJT Relaxation Oscillator**: 2N2646 ($\eta \approx 0.65$), 2N2647, PUT 2N6027, SCR 2N5060, TRIAC BT136, DIAC DB3.
            - **Audio & Differential Amplifiers**: LM386, MAT02 matched pair, TDA2030 14W Class AB Hi-Fi amp.
            - **Linear Regulators & Op-Amps**: LM741, TL082, LM358, LM317, LM7905, LM7912, LM7915.
            - **Digital Counters & Logic**: 74LS90, 74LS93, 74LS95, DFlipFlop, JK Flip-Flop.

            ### 💻 Performance Enhancements for Low-End Laptops:
            - **Windows 10/11 Process DPI Awareness V2**: Crisp rendering without GPU DWM stretching.
            - **Minimalist Squircle Vector Icon**: Embedded high-resolution multi-size icon.
            - **Automatic LTspice Detection**: Seamlessly locates LTspice across standard Windows 10/11 install paths.
            - **Debounced Instant Search**: Zero typing lag or stutter.
            - **Native LTspice Database Sync**: Updates `standard.dio`, `standard.bjt`, `standard.jft`, `standard.mos`.

            ### 📥 Download
            - **Recommended (No SmartScreen Warning)**: Download **`ltspice-component-adder-v2.3.0.zip`**, extract, and double-click to run!
            - **Standalone Executable**: Download **`ltspice-component-adder-by-Basi.exe`** directly.
          files: |
            desktop-app/dist/ltspice-component-adder-by-Basi.exe
            desktop-app/dist/ltspice-component-adder-v2.3.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
