<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d28"/>
      <stop offset="50%" stop-color="#0a0614"/>
      <stop offset="100%" stop-color="#06040d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7b39fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b39fc" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#7b39fc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7b39fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Tile (Modern Squircle with 112px radius) -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="7"/>

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#centerGlow)"/>

  <!-- Main Horizontal Circuit Path -->
  <!-- Left Ingress Trace -->
  <path d="M 60 256 L 168 256" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="78" cy="256" r="14" fill="#0a0614" stroke="url(#glowGrad)" stroke-width="8"/>

  <!-- Right Egress Trace -->
  <path d="M 346 256 L 452 256" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="434" cy="256" r="14" fill="#0a0614" stroke="url(#glowGrad)" stroke-width="8"/>

  <!-- Diode Triangle (Precision Rounded Polygon) -->
  <path d="M 172 150 
           C 172 142, 182 138, 188 142 
           L 326 248 
           C 334 252, 334 260, 326 264 
           L 188 370 
           C 182 374, 172 370, 172 362 
           Z" 
        fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Cathode Vertical Bar -->
  <rect x="336" y="144" width="18" height="224" rx="9" fill="url(#cyanGrad)" filter="url(#softGlow)"/>

  <!-- Adder "+" Accent Node (Top Right) -->
  <g transform="translate(376, 112)">
    <circle cx="0" cy="0" r="32" fill="#130a2a" stroke="url(#borderGrad)" stroke-width="3"/>
    <rect x="-14" y="-3.5" width="28" height="7" rx="3.5" fill="#22d3ee"/>
    <rect x="-3.5" y="-14" width="7" height="28" rx="3.5" fill="#22d3ee"/>
  </g>
</svg>